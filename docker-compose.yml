services:
  postgres:
    image: postgres:16
    container_name: caspex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-caspex_db}
      POSTGRES_USER: ${POSTGRES_USER:-caspex_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - caspex_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-caspex_user} -d ${POSTGRES_DB:-caspex_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: caspex-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - caspex_mosquitto_data:/mosquitto/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caspex-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - caspex_uploads_data:/app/uploads

volumes:
  caspex_postgres_data:
  caspex_uploads_data:
  caspex_mosquitto_data:
